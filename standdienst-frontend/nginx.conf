server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        set $proto $scheme;
        if ($http_x_forwarded_proto) {
            set $proto $http_x_forwarded_proto;
        }
        if ($http_x_forwarded_ssl = "on") {
            set $proto https;
        }
        proxy_pass http://api:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://api:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://api:8420;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
