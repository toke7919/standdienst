<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Subtle inner highlight -->
    <radialGradient id="shine" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <rect width="100" height="100" rx="22" fill="url(#shine)"/>

  <!-- Person — head -->
  <circle cx="48" cy="36" r="12" fill="white"/>

  <!-- Person — shoulders/body -->
  <path d="M 20 76 C 20 54 33 51 48 51 C 63 51 77 56 77 76 Z" fill="white"/>

  <!-- Badge ring (slight shadow) -->
  <circle cx="76" cy="24" r="17" fill="#065f46" opacity="0.3"/>
  <!-- Badge -->
  <circle cx="76" cy="24" r="15" fill="#10b981"/>

  <!-- Check mark -->
  <path d="M 68 24 L 74 31 L 84 16"
        fill="none" stroke="white" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
