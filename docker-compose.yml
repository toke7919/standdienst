services:
  db:
    # postgres:16 bewusst gehalten – ein Major-Upgrade ist nicht
    # datenverzeichnis-kompatibel und bräuchte pg_upgrade bzw. dump/restore.
    # PG16 EOL Nov 2028.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: standdienst
      POSTGRES_USER: standdienst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standdienst}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standdienst"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  api:
    build:
      context: ./standdienst-api
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY muss gesetzt sein}
      DATABASE_URL: postgresql://standdienst:${POSTGRES_PASSWORD:-standdienst}@db:5432/standdienst
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FLASK_DEBUG: "0"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
      - ./data/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "flask db upgrade && gunicorn wsgi:app --config gunicorn.conf.py"

  scheduler:
    build:
      context: ./standdienst-api
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY muss gesetzt sein}
      DATABASE_URL: postgresql://standdienst:${POSTGRES_PASSWORD:-standdienst}@db:5432/standdienst
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - ./data/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    command: python scheduler_worker.py
    restart: unless-stopped

  frontend:
    build:
      context: ./standdienst-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
