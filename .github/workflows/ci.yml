name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    defaults:
      run:
        working-directory: standdienst-api

    steps:
      - uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            standdienst-api/requirements.txt
            standdienst-api/requirements-dev.in

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.in

      - name: Tests ausführen
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32-chars!!
          DATABASE_URL: sqlite:///ci-test.db
        run: pytest --tb=short -q

      - name: Coverage-Report
        if: matrix.python-version == '3.13'
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32-chars!!
          DATABASE_URL: sqlite:///ci-test.db
        run: pytest --cov=app --cov-report=term-missing -q

      - name: Migration Roundtrip (upgrade → downgrade -1 → upgrade)
        if: matrix.python-version == '3.13'
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32-chars!!
          DATABASE_URL: sqlite:///ci-migrate.db
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db downgrade -- -1
          flask --app wsgi db upgrade
